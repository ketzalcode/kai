name: validate

# Guards the plugin contract on every PR and on pushes to main: frontmatter and
# name-to-path agreement, resolvable cross-references, the host-tool allowlist,
# workspace-contract consistency, the fixture manifest schema, per-manifest version
# agreement across the monolith and any committed pack trees, cross-pack reference
# resolution on all three firing paths (plus invoked assets and the single owner of
# hooks.json), and release hygiene (semver, changelog/README stamp for the current
# version, dependency/lockfile consistency, sanctioned git deps). It also runs the
# workspace-doctor self-test, the host-loader acceptance mirror, the release-guard
# self-test, the pack-generator self-test and its regenerate-and-diff check, and a
# syntax/parse check of shipped helper scripts. On pull requests it additionally
# runs the release-guard gate: a behavior-sensitive change must carry a version
# bump plus changelog/README updates.
# Dependency-free — no install step, so it stays fast.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate plugin contract
        run: node scripts/validate-plugin.mjs
      - name: Workspace-doctor self-test
        run: node scripts/workspace-doctor.mjs --self-test
      - name: Host-loader acceptance
        run: node scripts/host-contract.mjs --self-test
      - name: Release-guard self-test
        run: node scripts/release-guard.mjs --self-test
      - name: Pack generator self-test
        run: node scripts/pack-preview.mjs --self-test
      - name: Committed pack trees match the generator
        run: node scripts/pack-preview.mjs --check
      - name: Check helper script syntax
        run: node scripts/check-syntax.mjs
      - name: Release-guard (behavior change requires a bump + release notes)
        if: github.event_name == 'pull_request'
        run: node scripts/release-guard.mjs --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}
