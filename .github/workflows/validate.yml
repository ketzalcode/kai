name: validate

# Guards the plugin contract on every PR and on pushes to main: frontmatter and
# name-to-path agreement, resolvable cross-references, the host-tool allowlist,
# workspace-contract consistency, the fixture manifest schema, per-manifest version
# agreement across the monolith and any committed pack trees, cross-pack reference
# resolution on all three firing paths (plus invoked assets and the single owner of
# hooks.json), and release hygiene (semver, changelog/README stamp for the current
# version, dependency/lockfile consistency, sanctioned git deps). It also runs the
# workspace-doctor self-test, the host-loader acceptance mirror, the release-guard
# self-test, the pack-generator self-test and its regenerate-and-diff check, the
# four named partition gates (partition, collision, partial-install, version-skew),
# and a syntax/parse check of shipped helper scripts. On pull requests it
# additionally runs the release-guard gate: a behavior-sensitive change must carry
# a version bump plus changelog/README updates. A separate supported-Node job
# installs each dependency-bearing generated pack from an empty cache with Git
# disabled, then probes the pack-local Lectoria CLI and core provider root.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate plugin contract
        run: node scripts/validate-plugin.mjs
      - name: Workspace-doctor self-test
        run: node scripts/workspace-doctor.mjs --self-test
      - name: Host-loader acceptance
        run: node scripts/host-contract.mjs --self-test
      - name: Release-guard self-test
        run: node scripts/release-guard.mjs --self-test
      - name: Pack generator self-test
        run: node scripts/pack-preview.mjs --self-test
      # Four named gates rather than one: a red build should say which guarantee
      # broke, and these four fail for different reasons with different fixes.
      - name: Partition gate (one pack per agent, one provider per skill, kai-core-* namespace)
        run: node scripts/pack-preview.mjs --gate partition
      - name: Collision gate (no id emitted by two packs)
        run: node scripts/pack-preview.mjs --gate collision
      - name: Partial-install gate (a department installed with kai-core alone)
        run: node scripts/pack-preview.mjs --gate partial-install
      - name: Version-skew gate (contract pins agree; absent or skewed core fails closed)
        run: node scripts/pack-preview.mjs --gate version-skew
      - name: Committed pack trees match the generator
        run: node scripts/pack-preview.mjs --check
      - name: Check helper script syntax
        run: node scripts/check-syntax.mjs
      - name: Release-guard (behavior change requires a bump + release notes)
        if: github.event_name == 'pull_request'
        run: node scripts/release-guard.mjs --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}

  runtime-dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: [kai-core, kai-personal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install pack without Git or credentials
        shell: bash
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_SSH_COMMAND: /bin/false
          npm_config_git: /bin/false
          npm_config_registry: https://registry.npmjs.org/
          npm_config_update_notifier: 'false'
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home-${{ matrix.pack }}"
          export npm_config_cache="$RUNNER_TEMP/cache-${{ matrix.pack }}"
          export npm_config_userconfig="$HOME/.npmrc"
          mkdir -p "$HOME" "$npm_config_cache"
          npm ci --prefix "packs/${{ matrix.pack }}" \
            --no-audit --no-fund --foreground-scripts
          "packs/${{ matrix.pack }}/node_modules/.bin/lectoria" --help >/dev/null
      - name: Probe core provider-root resolution
        if: matrix.pack == 'kai-core'
        shell: pwsh
        run: |
          $skillDir = Resolve-Path 'packs/kai-core/skills/kai-core-generate-audio'
          $providerRoot = Split-Path -Parent (Split-Path -Parent $skillDir)
          $wrapper = Join-Path $providerRoot 'scripts/generate-audio.ps1'
          $source = Join-Path $skillDir 'SKILL.md'
          $output = & $wrapper -Source $source -Out "$env:RUNNER_TEMP/audio" -DryRun 6>&1 |
            Out-String
          if ($output -notmatch '\[dry-run\] lectoria: node_modules/.bin') {
            throw "Core wrapper did not select its pack-local Lectoria executable."
          }
