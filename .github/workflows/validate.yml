name: validate

# Guards the plugin contract on every PR and on pushes to main: frontmatter and
# name-to-path agreement, resolvable cross-references, the host-tool allowlist,
# workspace-contract consistency, the fixture manifest schema, per-manifest version
# agreement across the monolith and any committed pack trees, cross-pack reference
# resolution on all three firing paths (plus invoked assets and the single owner of
# hooks.json), and release hygiene (semver, changelog/README stamp for the current
# version, dependency/lockfile consistency, sanctioned git deps). It also runs the
# workspace-doctor self-test, the host-loader acceptance mirror, the release-guard
# self-test, the pack-generator self-test and its regenerate-and-diff check, the
# four named partition gates (partition, collision, partial-install, version-skew),
# and a syntax/parse check of shipped helper scripts. On pull requests it
# additionally runs the release-guard gate: a behavior-sensitive change must carry
# a version bump plus changelog/README updates. A separate `coordination-runtime`
# job executes the coordination inputs, store, engine, context, evidence, report,
# host, migration and CLI suites on every supported Node version, because that
# runtime is executable code over `node:sqlite` rather than declarative source. A
# separate supported-Node job installs each dependency-bearing generated pack from
# an empty cache with Git disabled, then probes the pack-local Lectoria CLI and
# core provider root. That job's matrix and its per-leg binary assertion are both
# derived from the pack partition (COMMITTED_PACKS and PACK_RUNTIME_DEPENDENCIES),
# so publishing a pack never means editing this workflow to make that pack legal.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    outputs:
      packs: ${{ steps.runtime-matrix.outputs.packs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # The coordination runtime uses `node:sqlite`, which Node 20 does not
          # ship. This must stay inside the `engines` range in package.json.
          node-version: '24.15.0'
      - name: Default marketplace and pre-release retention
        run: node test/package-availability-self-test.mjs
      - name: Engineering source contracts
        run: |
          node test/engineering-agents-self-test.mjs
          node test/engineering-foundation-self-test.mjs
      - name: Creative foundation source contracts
        run: |
          node test/creative-foundation-self-test.mjs
          node test/creative-core-contract-self-test.mjs
          node test/creative-agent-contract-self-test.mjs
          node test/creative-skill-contract-self-test.mjs
      - name: Coordination source and emission contracts
        run: |
          node test/coordination-authority-self-test.mjs
          node test/coordination-thread-self-test.mjs
          node test/coordination-source-routing-self-test.mjs
          node test/coordination-foundation-self-test.mjs
      - name: Validate plugin contract
        run: node scripts/validate-plugin.mjs
      - name: Workspace-doctor self-test
        run: node scripts/workspace-doctor.mjs --self-test
      - name: Host-loader acceptance
        run: node scripts/host-contract.mjs --self-test
      - name: Release-guard self-test
        run: node scripts/release-guard.mjs --self-test
      - name: Pack generator self-test
        run: node scripts/pack-preview.mjs --self-test
      # Four named gates rather than one: a red build should say which guarantee
      # broke, and these four fail for different reasons with different fixes.
      - name: Partition gate (one pack per agent, one provider per skill, kai-core-* namespace)
        run: node scripts/pack-preview.mjs --gate partition
      - name: Collision gate (no id emitted by two packs)
        run: node scripts/pack-preview.mjs --gate collision
      - name: Partial-install gate (a department installed with kai-core alone)
        run: node scripts/pack-preview.mjs --gate partial-install
      - name: Version-skew gate (contract pins agree; absent or skewed core fails closed)
        run: node scripts/pack-preview.mjs --gate version-skew
      - name: Committed pack trees match the generator
        run: node scripts/pack-preview.mjs --check
      - name: Check helper script syntax
        run: node scripts/check-syntax.mjs
      - name: Release-guard (behavior change requires a bump + release notes)
        if: github.event_name == 'pull_request'
        run: node scripts/release-guard.mjs --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}
      # The legs come from COMMITTED_PACKS, so publishing a pack adds its leg
      # without anyone editing this workflow to make that pack legal. The
      # existing required `contract` job owns the output, so derivation failure
      # cannot turn required runtime legs into accepted skipped checks.
      - id: runtime-matrix
        name: Derive the runtime-dependency legs from the committed pack set
        shell: bash
        run: |
          set -euo pipefail
          packs="$(node scripts/pack-preview.mjs --ci-matrix)"
          echo "packs=$packs" >> "$GITHUB_OUTPUT"

  # The coordination runtime is executable, not declarative: it opens a real
  # `node:sqlite` database, so it is exercised on every runtime this repository
  # claims to support rather than on one. The legs are pinned to the three
  # boundaries of `engines` ("^22.22.2 || ^24.15.0 || >=26.0.0"). Node 22 prints
  # its documented ExperimentalWarning for `node:sqlite`; that warning is left
  # visible on purpose — suppressing it would hide the fact that the oldest
  # supported leg runs the store on an experimental built-in.
  #
  # This job deliberately does not `needs: contract`. The repository currently
  # carries known-red pre-release validator errors in the contract job, and a
  # dependency would turn this evidence into a skipped check that reports
  # nothing. It installs no dependencies: every suite here imports only
  # `node:` built-ins and repository files.
  coordination-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.22.2', '24.15.0', '26.0.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Store, engine and inputs
        run: |
          node test/coordination-inputs-self-test.mjs
          node test/coordination-store-self-test.mjs
          node test/coordination-engine-self-test.mjs
      - name: Context, evidence and report
        run: |
          node test/coordination-context-self-test.mjs
          node test/coordination-evidence-self-test.mjs
          node test/coordination-report-self-test.mjs
      - name: Host composition and legacy migration
        run: |
          node test/coordination-host-self-test.mjs
          node test/coordination-migration-self-test.mjs
      - name: CLI surface
        run: node test/coordination-cli-self-test.mjs

  runtime-dependencies:
    needs: contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJSON(needs.contract.outputs.packs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install pack without Git or credentials
        shell: bash
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_SSH_COMMAND: /bin/false
          npm_config_git: /bin/false
          npm_config_registry: https://registry.npmjs.org/
          npm_config_update_notifier: 'false'
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home-${{ matrix.pack }}"
          export npm_config_cache="$RUNNER_TEMP/cache-${{ matrix.pack }}"
          export npm_config_userconfig="$HOME/.npmrc"
          mkdir -p "$HOME" "$npm_config_cache"
          npm ci --prefix "plugins/${{ matrix.pack }}" \
            --no-audit --no-fund --foreground-scripts
          # Derived from PACK_RUNTIME_DEPENDENCIES: a pack that declares none
          # installs its lockfile and asserts no binary. Captured first so a
          # failed derivation fails the leg instead of asserting nothing.
          binaries="$(node scripts/pack-preview.mjs --ci-runtime-binaries "${{ matrix.pack }}")"
          for binary in $binaries; do
            "plugins/${{ matrix.pack }}/node_modules/.bin/$binary" --help >/dev/null
          done
      - name: Probe core provider-root resolution
        if: matrix.pack == 'kai-core'
        shell: pwsh
        run: |
          $skillDir = Resolve-Path 'plugins/kai-core/skills/kai-core-generate-audio'
          $providerRoot = Split-Path -Parent (Split-Path -Parent $skillDir)
          $wrapper = Join-Path $providerRoot 'scripts/generate-audio.ps1'
          $source = Join-Path $skillDir 'SKILL.md'
          $output = & $wrapper -Source $source -Out "$env:RUNNER_TEMP/audio" -DryRun 6>&1 |
            Out-String
          if ($output -notmatch '\[dry-run\] lectoria: node_modules/.bin') {
            throw "Core wrapper did not select its pack-local Lectoria executable."
          }
