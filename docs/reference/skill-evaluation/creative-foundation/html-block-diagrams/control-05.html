<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search service ownership and containment</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7fb;
      --panel: #ffffff;
      --border: #2f3a4a;
      --muted: #5b6575;
      --lane: #eef3ff;
      --node: #ffffff;
      --shadow: 0 8px 24px rgba(26, 39, 68, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg), #ffffff);
      color: #18202b;
      padding: 24px;
    }

    figure {
      margin: 0 auto;
      max-width: 980px;
    }

    figcaption {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 14px;
      color: #111827;
    }

    .boundary {
      border: 3px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .boundary-label {
      display: inline-block;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #111827;
      background: #fff7d6;
      border: 1px solid #d8c36a;
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 16px;
    }

    .lanes {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .lane {
      border: 2px solid #9aa7bf;
      border-radius: 14px;
      background: var(--lane);
      padding: 14px;
    }

    .lane-title {
      margin: 0 0 12px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #20304a;
    }

    .components {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .node {
      background: var(--node);
      border: 1.5px solid #93a4c1;
      border-radius: 12px;
      padding: 14px;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .node-name {
      font-size: 1rem;
      font-weight: 700;
      color: #1a2433;
    }

    .node-desc {
      font-size: 0.95rem;
      line-height: 1.35;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      body {
        padding: 14px;
      }

      .components {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <figure>
    <figcaption>Search service ownership and containment</figcaption>
    <div class="boundary" role="img" aria-label="Search service ownership and containment diagram">
      <div class="boundary-label">Search service</div>
      <div class="lanes">
        <section class="lane" aria-labelledby="request-lane-title">
          <h2 class="lane-title" id="request-lane-title">Request lane</h2>
          <div class="components">
            <div class="node">
              <div class="node-name">Web client</div>
              <div class="node-desc">submits a search query</div>
            </div>
            <div class="node">
              <div class="node-name">Query service</div>
              <div class="node-desc">validates and routes the query</div>
            </div>
          </div>
        </section>

        <section class="lane" aria-labelledby="index-lane-title">
          <h2 class="lane-title" id="index-lane-title">Index lane</h2>
          <div class="components">
            <div class="node">
              <div class="node-name">Ingestion worker</div>
              <div class="node-desc">updates searchable content</div>
            </div>
            <div class="node">
              <div class="node-name">Search index</div>
              <div class="node-desc">stores searchable documents</div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </figure>
</body>
</html>
