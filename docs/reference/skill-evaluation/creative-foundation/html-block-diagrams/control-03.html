<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search service ownership and containment</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2937;
      --muted: #4b5563;
      --line: #94a3b8;
      --soft: #e2e8f0;
      --panel: #f8fafc;
      --lane: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: #fff;
    }

    figure {
      margin: 0 auto;
      max-width: 980px;
    }

    figcaption {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--ink);
    }

    .boundary {
      border: 2px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      padding: 18px;
    }

    .boundary-label {
      display: inline-block;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 14px;
      padding: 4px 10px;
      border: 1px solid var(--soft);
      border-radius: 999px;
      background: #fff;
    }

    .lanes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .lane {
      min-width: 0;
      border: 1px solid var(--soft);
      border-radius: 16px;
      background: var(--lane);
      padding: 16px;
    }

    .lane h2 {
      margin: 0 0 14px;
      font-size: 1rem;
      color: var(--ink);
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .component {
      border: 1px solid var(--soft);
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }

    .component strong {
      display: block;
      font-size: 1rem;
      margin-bottom: 4px;
      color: var(--ink);
    }

    .component span {
      display: block;
      color: var(--muted);
      line-height: 1.4;
      word-break: break-word;
    }

    @media (max-width: 720px) {
      body { padding: 16px; }
      .lanes { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <figure>
    <figcaption>Search service ownership and containment</figcaption>
    <div class="boundary" aria-label="Search service">
      <div class="boundary-label">Search service</div>
      <div class="lanes">
        <section class="lane" aria-labelledby="request-lane">
          <h2 id="request-lane">Request lane</h2>
          <div class="stack">
            <div class="component">
              <strong>Web client</strong>
              <span>submits a search query</span>
            </div>
            <div class="component">
              <strong>Query service</strong>
              <span>validates and routes the query</span>
            </div>
          </div>
        </section>

        <section class="lane" aria-labelledby="index-lane">
          <h2 id="index-lane">Index lane</h2>
          <div class="stack">
            <div class="component">
              <strong>Ingestion worker</strong>
              <span>updates searchable content</span>
            </div>
            <div class="component">
              <strong>Search index</strong>
              <span>stores searchable documents</span>
            </div>
          </div>
        </section>
      </div>
    </div>
  </figure>
</body>
</html>
