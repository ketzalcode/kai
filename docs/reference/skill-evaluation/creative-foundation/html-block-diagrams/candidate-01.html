<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search service ownership and containment</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8f9fa;
      --panel: #ffffff;
      --panel-2: #f1f3f5;
      --line: #ced4da;
      --text: #212529;
      --muted: #6c757d;
      --accent: #495057;
      --shadow: 0 0.5rem 1.25rem rgba(0, 0, 0, 0.06);
      --radius: 0.75rem;
      --gap: 0.9rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f14;
        --panel: #11161d;
        --panel-2: #171d25;
        --line: #334155;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #cbd5e1;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 1.25rem;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    figure.diagram {
      margin: 0 auto;
      max-width: 52rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
    }

    figcaption {
      margin: 0 0 1rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .boundary {
      border: 2px dashed var(--line);
      border-radius: calc(var(--radius) - 0.1rem);
      padding: 1rem;
      display: grid;
      gap: var(--gap);
      min-width: 0;
    }

    .boundary-label {
      display: inline-flex;
      align-self: start;
      padding: 0.15rem 0.7rem;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--line);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
      width: fit-content;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .lanes {
      display: grid;
      gap: var(--gap);
      min-width: 0;
    }

    .lane {
      display: grid;
      grid-template-columns: minmax(8rem, 10rem) minmax(0, 1fr);
      gap: 0.9rem;
      align-items: start;
      padding: 0.9rem;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) - 0.15rem);
      min-width: 0;
    }

    .lane h2 {
      margin: 0;
      font-size: 0.85rem;
      line-height: 1.2;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .cards {
      display: grid;
      gap: 0.75rem;
      min-width: 0;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-inline-start: 0.35rem solid var(--accent);
      border-radius: 0.6rem;
      padding: 0.8rem 0.9rem;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .card b,
    .card p {
      display: block;
      margin: 0;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .card b {
      font-size: 0.98rem;
      line-height: 1.25;
    }

    .card p {
      margin-top: 0.25rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 40rem) {
      body { padding: 0.75rem; }
      .lane { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <figure class="diagram" aria-label="Search service ownership and containment">
    <figcaption>Search service ownership and containment</figcaption>
    <div class="boundary">
      <div class="boundary-label">Search service</div>
      <div class="lanes">
        <section class="lane" aria-labelledby="request-lane">
          <h2 id="request-lane">Request lane</h2>
          <div class="cards">
            <article class="card">
              <b>Web client</b>
              <p>submits a search query</p>
            </article>
            <article class="card">
              <b>Query service</b>
              <p>validates and routes the query</p>
            </article>
          </div>
        </section>

        <section class="lane" aria-labelledby="index-lane">
          <h2 id="index-lane">Index lane</h2>
          <div class="cards">
            <article class="card">
              <b>Ingestion worker</b>
              <p>updates searchable content</p>
            </article>
            <article class="card">
              <b>Search index</b>
              <p>stores searchable documents</p>
            </article>
          </div>
        </section>
      </div>
    </div>
  </figure>
</body>
</html>
