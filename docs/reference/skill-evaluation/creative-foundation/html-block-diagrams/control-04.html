<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search service ownership and containment</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f6f8fb;
      --panel-bg: #ffffff;
      --border: #b8c3d6;
      --lane-border: #ced7e6;
      --text: #1f2937;
      --muted: #4b5563;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: var(--page-bg);
      color: var(--text);
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    figure {
      margin: 0 auto;
      max-width: 980px;
    }

    figcaption {
      margin: 0 0 12px;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    .boundary {
      border: 2px solid var(--border);
      border-radius: 18px;
      background: var(--panel-bg);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .boundary-label {
      display: inline-block;
      margin-bottom: 14px;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      background: #edf2f7;
      border: 1px solid #d6deea;
      font-weight: 700;
    }

    .lanes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .lane {
      border: 1.5px solid var(--lane-border);
      border-radius: 14px;
      background: #fbfdff;
      padding: 14px;
      min-width: 0;
    }

    .lane h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      line-height: 1.2;
    }

    .components {
      display: grid;
      gap: 10px;
    }

    .component {
      border: 1px solid #d8e0ec;
      border-radius: 12px;
      background: #ffffff;
      padding: 12px 14px;
      min-width: 0;
    }

    .component strong {
      display: block;
      margin-bottom: 4px;
      font-size: 1rem;
    }

    .component span {
      color: var(--muted);
      word-break: break-word;
    }

    @media (max-width: 720px) {
      body {
        padding: 14px;
      }

      .lanes {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <figure>
    <figcaption>Search service ownership and containment</figcaption>
    <div class="boundary" role="img" aria-label="Search service contains two ownership lanes: Request lane and Index lane. Request lane includes Web client and Query service. Index lane includes Ingestion worker and Search index.">
      <div class="boundary-label">Search service</div>
      <div class="lanes">
        <section class="lane" aria-labelledby="request-lane">
          <h2 id="request-lane">Request lane</h2>
          <div class="components">
            <div class="component">
              <strong>Web client</strong>
              <span>submits a search query</span>
            </div>
            <div class="component">
              <strong>Query service</strong>
              <span>validates and routes the query</span>
            </div>
          </div>
        </section>

        <section class="lane" aria-labelledby="index-lane">
          <h2 id="index-lane">Index lane</h2>
          <div class="components">
            <div class="component">
              <strong>Ingestion worker</strong>
              <span>updates searchable content</span>
            </div>
            <div class="component">
              <strong>Search index</strong>
              <span>stores searchable documents</span>
            </div>
          </div>
        </section>
      </div>
    </div>
  </figure>
</body>
</html>
