<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search service ownership and containment</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f6f8fb;
      --ink: #1f2937;
      --muted: #5b6472;
      --line: #c7d2e0;
      --panel: #ffffff;
      --lane: #eef3f9;
      --accent: #2f5d9b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: var(--page);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    figure.diagram {
      margin: 0 auto;
      max-width: 980px;
    }

    figcaption {
      margin: 0 0 14px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--ink);
    }

    .service {
      border: 2px solid var(--accent);
      border-radius: 18px;
      background: var(--panel);
      padding: 18px;
      box-shadow: 0 8px 24px rgba(31, 41, 55, 0.08);
    }

    .service-title {
      display: inline-block;
      margin: 0 0 16px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #e8f0fb;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .lanes {
      display: grid;
      gap: 14px;
    }

    .lane {
      background: var(--lane);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }

    .lane h3 {
      margin: 0 0 12px;
      font-size: 1rem;
      color: var(--ink);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .card {
      min-width: 0;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
    }

    .card .name {
      margin: 0 0 8px;
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--ink);
    }

    .card .desc {
      margin: 0;
      line-height: 1.45;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      body { padding: 14px; }
      .service { padding: 14px; border-radius: 14px; }
      .lane { padding: 12px; }
    }
  </style>
</head>
<body>
  <figure class="diagram" aria-labelledby="caption">
    <figcaption id="caption">Search service ownership and containment</figcaption>

    <section class="service" aria-label="Search service">
      <div class="service-title">Search service</div>

      <div class="lanes">
        <section class="lane" aria-labelledby="request-lane">
          <h3 id="request-lane">Request lane</h3>
          <div class="cards">
            <article class="card">
              <p class="name">Web client</p>
              <p class="desc">submits a search query</p>
            </article>
            <article class="card">
              <p class="name">Query service</p>
              <p class="desc">validates and routes the query</p>
            </article>
          </div>
        </section>

        <section class="lane" aria-labelledby="index-lane">
          <h3 id="index-lane">Index lane</h3>
          <div class="cards">
            <article class="card">
              <p class="name">Ingestion worker</p>
              <p class="desc">updates searchable content</p>
            </article>
            <article class="card">
              <p class="name">Search index</p>
              <p class="desc">stores searchable documents</p>
            </article>
          </div>
        </section>
      </div>
    </section>
  </figure>
</body>
</html>
